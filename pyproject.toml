[project]
name = "petalert"
version = "0.1.0"
description = "Telegram bot that alerts about new house-sits (TrustedHousesitters, more sites later)"
requires-python = ">=3.12"
dependencies = [
    # 3.31 was current when the project started; capped at the major version
    # because 2→3 already renamed exception classes and attributes
    # (RetryAfter.timeout → TelegramRetryAfter.retry_after), and that kind of
    # break only shows up under a flood limit.
    "aiogram>=3.31,<4",
    # Client for the source sites. aiohttp already comes with aiogram, but httpx
    # has MockTransport for tests and a simple `proxy=` (0.28 removed
    # `proxies=`, hence the 0.28 floor).
    "httpx>=0.28,<1",
    # Nomador sits behind Cloudflare, which challenges Python's own TLS
    # handshake (the OpenSSL 3.0 of Ubuntu 24.04's Python 3.12) whatever the
    # IP. curl_cffi shakes hands like Chrome; only requests that ask for it
    # use it (Http's `browser`). 0.x, so capped below 1 like httpx.
    "curl_cffi>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["petalert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
